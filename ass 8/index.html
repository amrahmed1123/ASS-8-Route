<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ContactHub - Smart Contact Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" href="./photos/contacts-book.png">
  <link rel="stylesheet" href="./CSS/bootstrap.min.css">
  <link rel="stylesheet" href="./CSS/style.css">
</head>
<body>

  <header class="app-header sticky-top">
    <div class="my-container d-flex align-items-center justify-content-between py-3">
      <div class="d-flex align-items-center gap-3">
        <div class="logo-box"><i class="fa-solid fa-address-book"></i></div>
        <div>
          <h1 class="brand mb-0">Contact<span>Hub</span></h1>
          <small class="brand-sub">Smart Contact Manager</small>
        </div>
      </div>
      <div class="d-flex align-items-center gap-3 gap-md-4">
        <button class="btn btn-add" id="addBtn"><i class="fa-solid fa-plus me-2"></i>Add Contact</button>
        <button class="icon-link d-none d-sm-block" aria-label="Notifications"><i class="fa-solid fa-bell"></i></button>
        <button class="icon-link d-none d-sm-block" aria-label="Settings"><i class="fa-solid fa-gear"></i></button>
        <img class="avatar-img" src="./photos/avatar-2.jpg" alt="profile">
      </div>
    </div>
  </header>

  <main class="my-container py-4">

    <section class="row g-3 g-lg-4 mb-4">
      <div class="col-md-4">
        <div class="stat-card">
          <div class="stat-icon bg-blue"><i class="fa-solid fa-users"></i></div>
          <div>
            <div class="stat-label">Total</div>
            <div class="stat-num" id="totalCount">0</div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="stat-card">
          <div class="stat-icon bg-orange"><i class="fa-solid fa-star"></i></div>
          <div>
            <div class="stat-label">Favorites</div>
            <div class="stat-num" id="favCount">0</div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="stat-card">
          <div class="stat-icon bg-red"><i class="fa-solid fa-heart-pulse"></i></div>
          <div>
            <div class="stat-label">Emergency</div>
            <div class="stat-num" id="emgCount">0</div>
          </div>
        </div>
      </div>
    </section>

    <div class="row g-4">
      <div class="col-lg-8">
        <h2 class="section-title">All Contacts</h2>
        <p class="section-sub" id="subText">Manage and organize your 0 contacts</p>

        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="searchInput" class="form-control" placeholder="Search by name, phone, or email...">
        </div>

        <div class="row g-3" id="contactsList"></div>

        <div class="empty-state text-center" id="emptyState">
          <div class="empty-icon"><i class="fa-solid fa-address-book"></i></div>
          <p class="empty-title">No contacts found</p>
          <p class="empty-sub">Click "Add Contact" to get started</p>
        </div>
      </div>

      <aside class="col-lg-4">
        <div class="side-card mb-4">
          <div class="side-head fav-head">
            <div class="side-icon bg-orange"><i class="fa-solid fa-star"></i></div>
            <div>
              <h3>Favorites</h3>
              <small>Quick access to starred contacts</small>
            </div>
          </div>
          <div class="side-body" id="favList"></div>
        </div>

        <div class="side-card">
          <div class="side-head emg-head">
            <div class="side-icon bg-red"><i class="fa-solid fa-heart-pulse"></i></div>
            <div>
              <h3>Emergency</h3>
              <small>Important contacts for urgent calls</small>
            </div>
          </div>
          <div class="side-body" id="emgList"></div>
        </div>
      </aside>
    </div>
  </main>
  <div class="modal fade" id="contactModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">Add New Contact</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="contactForm" class="d-flex flex-column overflow-hidden" novalidate>
          <div class="modal-body">
            <div class="photo-wrap text-center">
              <div class="photo-preview" id="photoPreview"><i class="fa-solid fa-user"></i></div>
              <button type="button" class="btn btn-photo" id="photoBtn"><i class="fa-solid fa-camera me-2"></i>Change Photo</button>
              <input type="file" id="photoInput" accept="image/*" hidden>
            </div>
            <div class="mb-3">
              <label for="nameInput" class="form-label">Full Name <span class="req">*</span></label>
              <input type="text" class="form-control" id="nameInput" placeholder="Enter full name" maxlength="40">
              <div class="invalid-feedback" id="nameError"></div>
            </div>
            <div class="mb-3">
              <label for="phoneInput" class="form-label">Phone Number <span class="req">*</span></label>
              <input type="tel" class="form-control" id="phoneInput" placeholder="e.g., 01012345678" inputmode="numeric">
              <div class="invalid-feedback" id="phoneError"></div>
            </div>
            <div class="mb-3">
              <label for="emailInput" class="form-label">Email Address</label>
              <input type="email" class="form-control" id="emailInput" placeholder="name@example.com">
              <div class="invalid-feedback" id="emailError"></div>
            </div>
            <div class="mb-3">
              <label for="addressInput" class="form-label">Address</label>
              <input type="text" class="form-control" id="addressInput" placeholder="Enter address">
            </div>
            <div class="mb-3">
              <label for="groupInput" class="form-label">Group</label>
              <select class="form-select" id="groupInput">
                <option value="">Select a group</option>
                <option>Family</option>
                <option>Friends</option>
                <option>Work</option>
                <option>School</option>
                <option>Other</option>
              </select>
            </div>
            <div class="mb-4">
              <label for="notesInput" class="form-label">Notes</label>
              <textarea class="form-control" id="notesInput" rows="2" placeholder="Add notes about this contact"></textarea>
            </div>
            <div class="d-flex gap-4 mb-4">
              <label class="check-opt"><input type="checkbox" id="favInput"><i class="fa-solid fa-star text-star"></i> Favorite</label>
              <label class="check-opt"><input type="checkbox" id="emgInput"><i class="fa-solid fa-heart-pulse text-emg"></i> Emergency</label>
            </div>
            <div class="d-flex gap-3">
              <button type="button" class="btn btn-cancel flex-fill" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-save flex-fill" id="saveBtn"><i class="fa-solid fa-check me-2"></i>Save Contact</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="./JS/bootstrap.bundle.min.js"></script>
  <script src="./JS/script.js"></script>
</body>
</html>
